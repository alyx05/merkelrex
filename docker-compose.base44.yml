services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - build-cache:/app/build
    command: sh -c "cmake -B build -S . && cmake --build build -j$$(nproc) && ./build/merkelrex"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - api
    restart: unless-stopped

volumes:
  build-cache:
